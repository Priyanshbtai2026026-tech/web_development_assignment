<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 8 - Grid - Priyansh</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#333;color:white;padding:15px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;padding:20px}
.item{background:white;padding:20px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1);text-align:center}
.item h3{color:#e91e63}
footer{background:#333;color:white;text-align:center;padding:10px}
</style>
</head>
<body>
<header><h1>My Blog Grid - Priyansh Mishra</h1></header>
<div class="grid">
<div class="item"><h3>HTML</h3><p>HTML is the structure of web page.</p></div>
<div class="item"><h3>CSS</h3><p>CSS is used for styling and layout.</p></div>
<div class="item"><h3>JavaScript</h3><p>JS makes website interactive.</p></div>
<div class="item"><h3>GitHub</h3><p>GitHub is used to host and share code.</p></div>
</div>
<footer>Week 8 by Priyansh</footer>
</body>
</html>
